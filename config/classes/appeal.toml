id = "appeal"
priority = 10
engines = ["python"]
extractor = "kio2json.appeal.extract"

[routing]
pages = 2
headings = ["odwołanie"]
required = ["odwołując"]
forbidden = ['^\s*(?:wyrok|postanowienie|w imieniu rzeczypospolitej polskiej)\s*$']

[fields.OdwolanieKIO]
type = "object"
nullable = false
instruction = "Facts about the appeal and its first allegation."

[fields.OdwolanieKIO.fields]
data = { type = "string", normalizer = "iso_date", instruction = "Filing date from the date line in the first-page heading." }
czynnosc_dzien = { type = "string", normalizer = "iso_date", instruction = "Date of the act starting the appeal deadline for the first allegation. Return null without a reliable date for that allegation." }
czynnosc_powod_id = { type = "integer", instruction = "Take the integer reason ID solely from the first allegation. The canonical ID and description pairs are 1=Decyzja o odrzuceniu oferty, 2=Ogłoszenie wyboru oferty, 3=Decyzja o wykluczeniu wykonawcy, 4=Publikacja specyfikacji warunków zamówienia (SWZ), 5=Modyfikacja treści SWZ, 6=Odpowiedzi/wyjaśnienia do SWZ, 7=Zaniechanie odrzucenia oferty, 8=Zaniechanie wykluczenia wykonawcy, 9=Decyzja o unieważnieniu postępowania, 10=Zaniechanie unieważnienia postępowania, 11=Opis przedmiotu zamówienia (OPZ), 12=Projektowane postanowienia umowy." }
czynnosc_opis = { type = "string", instruction = "Return the canonical Polish description from the organizer's action dictionary for the ID determined from the first allegation." }
miejscowosc = { type = "string", instruction = "Place from the first-page heading on the date line." }

[fields.Odwolujacy]
match_by = "nazwa"
type = "list"
nullable = false
instruction = "Appellant, or the leader of the appellant consortium."

[fields.Odwolujacy.items]
type = "object"
nullable = false
instruction = "Identify the appellant from its party block."

[fields.Odwolujacy.items.fields]
krs = { type = "string", normalizer = "krs", instruction = "KRS of the appellant or consortium leader, if given." }
nazwa = { type = "string", instruction = "Full name in the appellant section. For a consortium give the leader's name." }
nip = { type = "string", normalizer = "nip", instruction = "NIP of the appellant or consortium leader, if given." }
regon = { type = "string", normalizer = "regon", instruction = "REGON of the appellant or consortium leader, if given." }
przez-pelnomocnika = { type = "integer", nullable = false, instruction = "Whether the appellant acts through counsel: 1 for yes, 0 for no." }

[fields.Odwolujacy.items.fields.pelnomocnik]
type = "object"
nullable = false
instruction = "Counsel representing the appellant."

[fields.Odwolujacy.items.fields.pelnomocnik.fields]
imie_nazwisko = { type = "string", instruction = "First and last name of the appellant's counsel, if present." }
nazwa = { type = "string", instruction = "Name of the entity employing counsel." }
mail = { type = "string", instruction = "Contact email of the appellant's counsel." }

[fields.Zamawiajacy]
match_by = "nazwa"
type = "list"
nullable = false
instruction = "Contracting authorities named in the appeal."

[fields.Zamawiajacy.items]
type = "object"
nullable = false
instruction = "One contracting authority."

[fields.Zamawiajacy.items.fields]
krs = { type = "string", normalizer = "krs", instruction = "KRS explicitly given for this contracting authority." }
nazwa = { type = "string", instruction = "Full name of the entity in the contracting authority section." }
nip = { type = "string", normalizer = "nip", instruction = "NIP explicitly given for this contracting authority." }
regon = { type = "string", normalizer = "regon", instruction = "REGON explicitly given for this contracting authority." }
prowadzacy_postepowanie = { type = "integer", instruction = "Null without information. When multiple authorities are named, use 1 for the designated lead and 0 for an authority that is not designated lead." }

[fields.ZamowieniePubliczne]
type = "object"
nullable = false
instruction = "The public procurement procedure."

[fields.ZamowieniePubliczne.fields]
numer_bzp = { type = "string", instruction = "BZP notice number in YYYY/BZP######## format, optionally followed by /## for a correction. Remove spaces and exclude TED numbers." }
numer_postepowania = { type = "string", instruction = "Internal procurement reference number found after its label." }
numer_ted = { type = "string", instruction = "TED notice number as NNNNNN-YYYY. Convert YYYY/S ###-NNNNNN to this form." }
tytul = { type = "string", instruction = "Title of the procurement or procedure, if stated." }
