x-jury: &jury
  build:
    context: .
    dockerfile: api.Dockerfile
    platforms: [linux/amd64]
  image: kio2json-jury:local
  pull_policy: build
  # libsass and morfeusz2 have no Linux ARM wheels on PyPI, and morfeusz2 has no source distribution either, so the
  # image is x86-64. Docker Desktop on Apple Silicon runs it under emulation, which is slower.
  platform: linux/amd64
  env_file:
    - path: .env
      required: false

services:
  cli:
    <<: *jury
    user: "0:0"
    # Match the output directory owner on Linux so the jury can edit or delete results.
    entrypoint:
      - /bin/sh
      - -ec
      - 'exec setpriv --reuid="$$(stat -c %u /app/output)" --regid="$$(stat -c %g /app/output)" --clear-groups "$$@"'
      - cli
    command: ["python", "-m", "kio2json", "--jobs", "2"]
    volumes:
      - ./input:/app/input:ro
      - ./output:/app/output
      - ./config/classes:/app/config/classes:ro
    healthcheck:
      disable: true

  gui:
    <<: *jury
    command: ["uvicorn", "kio2json.jury_web:app", "--host", "0.0.0.0", "--port", "8000"]
    # Allow time for OCR on a jury laptop when uploading scanned appeals.
    environment:
      KIO_WEB_DOC_TIMEOUT_S: "300"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./config/classes:/app/config/classes:ro
