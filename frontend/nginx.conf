server {
    listen 80;
    root /usr/share/nginx/html;

    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location / {
        try_files $uri $uri/ =404;
        expires -1;
    }

    location /fonts/ {
        expires 30d;
    }

    # Extraction API (kio2json.web_api). Resolved at request time, so nginx still starts while the API container
    # is down; the page then gets 502 from /api/health and keeps files in the browser.
    client_max_body_size 210m;  # 10 files x 20 MB, as in kio2json/web_api.py
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://doc2json-api:8000;
    location /api/ {
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        # Own headers here drop the page CSP, which would block the Swagger UI assets of /api/docs.
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }
}
