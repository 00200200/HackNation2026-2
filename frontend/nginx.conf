server {
    listen 80;
    root /usr/share/nginx/html;

    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location / {
        try_files $uri $uri/ =404;
        expires -1;
    }

    location /fonts/ {
        expires 30d;
    }

    # No extraction backend yet: the page checks /api/health and keeps files in the browser on 404.
    # When the backend exists, proxy /api/ to it here (as in HackNation2026's frontend/nginx.conf).
    location /api/ {
        return 404;
    }
}
