[project]
name = "hacknation2026-2"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "pdfplumber>=0.11.11",
    "pydantic-ai>=2.71.0",
    "pytesseract>=0.3.13",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 120
extend-exclude = ["data"]
